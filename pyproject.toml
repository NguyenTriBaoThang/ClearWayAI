[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "clearway-ai"
version = "0.1.0"
description = "ClearWayAI: 3D Digital Twin, Multi-Intersection Pre-clearance, and Traffic Optimization System"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Nguyen Tri Bao Thang", email = "author@clearway.ai" }
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "httpx>=0.27.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "scikit-learn>=1.4.0",
    "pyyaml>=6.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0",
]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --import-mode=importlib"
testpaths = [
    "tests",
    "apps/api/tests",
]
python_files = ["test_*.py", "*_test.py"]
pythonpath = [
    ".",
    "apps/api/src",
]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
    ".git",
    "node_modules",
    "dist",
    "data",
    "models",
    ".venv",
]
