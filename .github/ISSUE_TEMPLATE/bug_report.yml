name: "🐛 Bug Report"
description: "File an issue about broken functionality, simulation error, or visual defect"
title: "[BUG]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Please fill out this report with reproduction steps to help us diagnose and fix the issue.
  - type: input
    id: affected_component
    attributes:
      label: "Affected Component"
      description: "Specify the subsystem (e.g. apps/web, apps/api, 3d-scene, simulation/sumo, ai/clearance)"
      placeholder: "e.g. 3D Digital Twin Canvas, SUMO TraCI adapter"
    validations:
      required: true
  - type: textarea
    id: bug_description
    attributes:
      label: "Bug Description"
      description: "A clear and concise description of what the bug is."
    validations:
      required: true
  - type: textarea
    id: reproduction_steps
    attributes:
      label: "Steps to Reproduce"
      description: "Step-by-step instructions to reproduce the issue."
      placeholder: |
        1. Start API with '...'
        2. Open dashboard on '...'
        3. Trigger emergency corridor action
        4. See error
    validations:
      required: true
  - type: textarea
    id: expected_behavior
    attributes:
      label: "Expected Behavior"
      description: "What did you expect to happen?"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: "Environment Details"
      description: "OS, Browser, Python / Node version, GPU"
      placeholder: "Windows 11, Chrome 124, Python 3.13, RTX 4070"
    validations:
      required: true
