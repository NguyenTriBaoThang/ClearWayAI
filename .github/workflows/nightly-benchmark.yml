name: Nightly Simulation & FPS Benchmark

"on":
  schedule:
    # Run every night at 02:00 UTC
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  benchmark:
    name: Nightly Benchmark & Visual Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run Visual Fidelity & FPS Performance Audit
        run: |
          python audit_visual_fidelity_and_fps.py

      - name: Run Full Test Matrix
        run: |
          pytest tests/ -q
